[package]
name = "forma-app-platform"
version = "0.1.0"
edition = "2021"
# Preserve the consumer floor. Resolver 3 is cargo's MSRV-aware resolver (Cargo
# 1.84+): Cargo.lock and every later `cargo update` pick crate versions that
# still build on this Rust.
rust-version = "1.85"
resolver = "3"

[dependencies]
forma-ir = "=3.2.0"
forma-ir-derive = "=3.2.0"
forma-server = "=3.2.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.190"
sha2 = "=0.11.0"
genui-auth-verifier = { path = "../spikes/APP-006" }
base64 = "=0.22.1"
ring = "=0.17.14"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
url = "=2.5.8"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[lib]
name = "genui"
path = "src/lib.rs"
