[package]
name = "forma-app-platform"
version = "0.1.0"
edition = "2021"
# Preserve the consumer floor. Resolver 3 is cargo's MSRV-aware resolver (Cargo
# 1.84+): Cargo.lock and every later `cargo update` pick crate versions that
# still build on this Rust.
rust-version = "1.85"
resolver = "3"

[dependencies]
forma-ir = "=3.2.0"
forma-ir-derive = "=3.2.0"
forma-server = "=3.2.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.190"
sha2 = "=0.11.0"
genui-auth-verifier = { path = "../spikes/APP-006" }
base64 = "=0.22.1"
ring = "=0.17.14"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
url = "=2.5.8"
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
deadpool = { version = "=0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
# APP-095: the SSE body stream type (already in the lock through axum/hyper).
futures-core = "=0.3.34"
# APP-124 review: NFKD for the shared address slug (already in the lock through url/idna).
unicode-normalization = "=0.1.26"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
# APP-009: the same reviewed verifier against the cfg(test) loopback issuer;
# a dev-dependency feature, so release builds never contain the constructor.
genui-auth-verifier = { path = "../spikes/APP-006", features = ["loopback-http"] }

[features]
# ADR-007 D7.13: the APP-006 operator qualification harness compiles only in
# the isolated qualification executable; release builds never enable it.
qualification-harness = []

[lib]
name = "genui"
path = "src/lib.rs"

# ADR-012 D12.4: dev builds keep line tables (backtraces keep line numbers)
# and pack debug info, instead of macOS's default of leaving it in every
# codegen unit's object file across build hashes (inventory §B.7).
# Dependencies carry no debug info. Release profiles and images are unaffected.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
