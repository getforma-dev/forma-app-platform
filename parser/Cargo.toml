[workspace]
members = ["guest", "host"]
resolver = "2"

[profile.release]
opt-level = 2
panic = "abort"

# Job-mode tests spawn the debug `parser-host`, which compiles the guest once
# per process; unoptimized Cranelift made that suite take minutes. Dependencies
# only: workspace crates and every release artifact are unaffected.
[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

[patch.crates-io]
zip = { path = "vendor/zip-9.1.3" }
