[package]
name = "genui-auth-verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
publish = false

[dependencies]
base64 = "=0.22.1"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["sync", "time", "rt", "macros"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["sync", "time", "rt-multi-thread", "macros", "net", "io-util", "test-util"] }

[features]
# Test-only: `Verifier::new_loopback_for_tests` (plain HTTP on a loopback
# address). Consumers enable it as a dev-dependency feature only, so a release
# build never contains it.
loopback-http = []
