name: Parser qualification
on:
  push:
  pull_request:
permissions:
  contents: read
# ADR-013 D13.5: a newer push to the same ref cancels this workflow's superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: spikes/APP-004
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: Install the recorded Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - name: Verify source packaging and synthetic fixtures
        run: |
          python3 verify_vendor.py
          python3 make_fixtures.py
          git diff --exit-code -- fixtures
          cargo fmt --all --check
      - name: Compile the actual parser with no system interface
        run: cargo build --locked -p parser-guest --target wasm32-unknown-unknown --release
      - name: Lint and qualify resource, hostile input and recovery behavior
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p parser-guest --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked -p parser-host -- --test-threads=1 --nocapture
