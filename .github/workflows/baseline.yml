name: Released baseline
on:
  push:
  pull_request:
permissions:
  contents: read
# ADR-013 D13.5: a newer push to the same ref cancels this workflow's superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.0'
      - name: Match qualification toolchains
        run: |
          npm install --global npm@11.6.2
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt
          rustup default 1.93.1
      - name: Reproduce baseline from lockfiles
        run: python3 spikes/APP-001/verify.py
