name: Published canvas consumer
on:
  push:
  pull_request:
permissions:
  contents: read
# ADR-013 D13.5: a newer push to the same ref cancels this workflow's superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-003:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
      - name: Pinned tools and browser engines
        run: |
          npm install --global npm@11.6.2
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt
          rustup default 1.93.1
          npm ci --prefix spikes/APP-003/admin
          cd spikes/APP-003/admin
          npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Strict published native build, render and browser qualification
        run: python3 spikes/APP-003/verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: app003-canvas-evidence
          path: evidence/APP-003/
          retention-days: 14
