name: Bounded query qualification
on:
  push:
  pull_request:
permissions:
  contents: read
# ADR-013 D13.5: a newer push to the same ref cancels this workflow's superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.14'
      - name: Install exact published dependencies
        run: |
          python -m venv spikes/APP-005/.venv
          spikes/APP-005/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r contracts/requirements.lock -r spikes/APP-005/requirements.lock
      - name: Exercise typed queries, resource limits and OS confinement
        run: spikes/APP-005/.venv/bin/python spikes/APP-005/run.py --output evidence/APP-005/ci-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: app-005-query-evidence
          path: evidence/APP-005/ci-run
          retention-days: 14
