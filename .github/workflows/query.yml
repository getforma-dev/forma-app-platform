name: Bounded query qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: Install exact published dependencies
        run: |
          python -m venv spikes/APP-005/.venv
          spikes/APP-005/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r contracts/requirements.lock -r spikes/APP-005/requirements.lock
      - name: Exercise typed queries, resource limits and OS confinement
        run: spikes/APP-005/.venv/bin/python spikes/APP-005/run.py --output evidence/APP-005/ci-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-005-query-evidence
          path: evidence/APP-005/ci-run
          retention-days: 14
