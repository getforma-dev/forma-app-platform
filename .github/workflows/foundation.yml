name: Foundation preparation
on:
  push:
  pull_request:
permissions:
  contents: read
# ADR-013 D13.5: a newer push to the same ref cancels this workflow's superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    # Cold scaffold and image builds can consume 20 minutes before image checks.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.14'
      - name: Match toolchains
        run: |
          npm install --global npm@11.6.2
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.93.1
      - name: Check local scaffold and CDK without deployment
        run: python3 scripts/check-foundation.py
      - name: Verify migration as a non-superuser PostgreSQL administrator
        run: python3 app/runtime/qualify_migration.py --output evidence/APP-007/migration-repair/ci-postgresql16.json
      - name: Verify restore manifest SQL and column privilege refusal
        run: python3 evidence/APP-007/restore-local-sql/qualify.py --output-dir evidence/APP-007/restore-sql-ci
      - name: Build immutable-source runtime image locally
        run: docker build --tag genui-foundation-ci --file app/Dockerfile .
      - name: Exercise image with no network and a read-only root
        run: python3 app/runtime/qualify_image.py --image genui-foundation-ci --output evidence/APP-007/image-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: app-007-local-foundation-evidence
          path: |
            evidence/APP-007/local-preparation.json
            evidence/APP-007/image-qualification.json
            evidence/APP-007/migration-repair/ci-postgresql16.json
            evidence/APP-007/restore-sql-ci/results.json
          retention-days: 14
