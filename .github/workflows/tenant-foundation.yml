name: Tenant foundation qualification
on:
  push:
  pull_request:
permissions:
  contents: read
# ADR-013 D13.5: a newer push to the same ref cancels this workflow's superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tenant-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: Install recorded toolchains and locked operator validators
        run: |
          npm install --global npm@11.6.2
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup toolchain install 1.85.0 --profile minimal
          python3 -m venv app/runtime/.venv
          app/runtime/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r app/runtime/requirements.lock -r contracts/requirements.lock
          mkdir -p "$RUNNER_TEMP/tenant-foundation"
      - name: Check schema-version and catalog-bound pins, runner and pin-check unit tests
        run: |
          python3 scripts/check-schema-pins.py
          app/runtime/.venv/bin/python -m unittest discover -s scripts -p 'test_*.py' -v
          app/runtime/.venv/bin/python -m unittest discover -s app/runtime -v
          app/runtime/.venv/bin/python -m unittest discover -s app/qualification -v
      - name: Build source-owned native page assets
        working-directory: app/admin
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Check source, fixed-role primitives and the compiler floor
        working-directory: app
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib storage:: -- --test-threads=1
          cargo +1.85.0 check --locked --lib --tests
      - name: Qualify real PostgreSQL migration, catalog, RLS and lock races
        run: app/runtime/.venv/bin/python app/runtime/qualify_tenant_schema.py --output "$RUNNER_TEMP/tenant-foundation/schema.json"
      - name: Qualify real TLS pools, cancellation, tenant authorization and composed readiness
        working-directory: app
        run: GENUI_NATIVE_REPORT="$RUNNER_TEMP/tenant-foundation/native.json" cargo test --locked --lib storage::qualification::native_postgres_campaign -- --ignored --exact --nocapture
      - name: Qualify admission operations and the operator command over TLS (APP-073)
        working-directory: app
        run: GENUI_ADMISSION_REPORT="$RUNNER_TEMP/tenant-foundation/admission.json" cargo test --locked --lib storage::admission_qualification::native_admission_campaign -- --ignored --exact --nocapture
      - name: Qualify managed-entry cleanup on real TLS transports (APP-075)
        working-directory: app
        run: cargo test --locked --lib storage::managed_qualification::tests::managed_cleanup_with_real_transports -- --ignored --exact --nocapture
      - name: Qualify typed definition admission and re-admission (APP-010)
        working-directory: app
        run: GENUI_DEFINITION_REPORT="$RUNNER_TEMP/tenant-foundation/definition.json" cargo test --locked --lib storage::definition_qualification::native_definition_campaign -- --ignored --exact --nocapture
      - name: Qualify verified sign-in sessions, epochs and sign-out (APP-009)
        working-directory: app
        run: GENUI_SESSION_REPORT="$RUNNER_TEMP/tenant-foundation/session.json" cargo test --locked --lib auth::tests::native_session_campaign -- --ignored --exact --nocapture
      - name: Qualify invite redemption and entitlement (APP-074)
        working-directory: app
        run: GENUI_INVITE_REPORT="$RUNNER_TEMP/tenant-foundation/invite.json" cargo test --locked --lib auth::invite_tests::native_invite_campaign -- --ignored --exact --nocapture
      - name: Qualify explicit record commands, outcomes and audit (APP-013)
        working-directory: app
        run: GENUI_COMMAND_REPORT="$RUNNER_TEMP/tenant-foundation/command.json" cargo test --locked --lib storage::command_qualification::native_command_campaign -- --ignored --exact --nocapture
      - name: Qualify command races, revocation and restart (APP-014)
        working-directory: app
        run: GENUI_RACE_REPORT="$RUNNER_TEMP/tenant-foundation/race.json" cargo test --locked --lib storage::race_qualification::native_race_campaign -- --ignored --exact --nocapture
      - name: Qualify the confined query child (APP-012)
        working-directory: app
        run: GENUI_QUERY_PYTHON="$GITHUB_WORKSPACE/app/runtime/.venv/bin/python" cargo test --locked --lib query::tests::engine_child_campaign -- --ignored --exact --nocapture
      - name: Qualify authorized queries, receipts and release (APP-012)
        working-directory: app
        run: GENUI_QUERY_PYTHON="$GITHUB_WORKSPACE/app/runtime/.venv/bin/python" GENUI_QUERY_REPORT="$RUNNER_TEMP/tenant-foundation/query.json" cargo test --locked --lib storage::query_qualification::native_query_campaign -- --ignored --exact --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-008-tenant-foundation-evidence
          path: ${{ runner.temp }}/tenant-foundation
          retention-days: 14
