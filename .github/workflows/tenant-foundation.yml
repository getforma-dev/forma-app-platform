name: Tenant foundation qualification
on:
  push:
  pull_request:
permissions:
  contents: read
# ADR-013 D13.5: a newer push to the same ref cancels this workflow's superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tenant-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.14'
      - name: Install recorded toolchains and locked operator validators
        run: |
          npm install --global npm@11.6.2
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup toolchain install 1.85.0 --profile minimal
          python3 -m venv app/runtime/.venv
          app/runtime/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r app/runtime/requirements.lock -r contracts/requirements.lock
          mkdir -p "$RUNNER_TEMP/tenant-foundation"
      - name: Check schema-version and catalog-bound pins, runner and pin-check unit tests
        run: |
          python3 scripts/check-schema-pins.py
          app/runtime/.venv/bin/python -m unittest discover -s scripts -p 'test_*.py' -v
          app/runtime/.venv/bin/python -m unittest discover -s app/runtime -v
          app/runtime/.venv/bin/python -m unittest discover -s app/qualification -v
          app/runtime/.venv/bin/python -I app/operator/test_shared_invite_broker.py
      - name: Build source-owned native page assets
        working-directory: app/admin
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Check source, fixed-role primitives and the compiler floor
        run: |
          cargo fmt --check -p forma-app-platform
          cargo clippy --locked -p forma-app-platform --all-targets -- -D warnings
          cargo test --locked -p forma-app-platform --lib storage:: -- --test-threads=1
          cargo +1.85.0 check --locked -p forma-app-platform --lib --tests
      - name: Qualify real PostgreSQL migration, catalog, RLS and lock races
        run: app/runtime/.venv/bin/python app/runtime/qualify_tenant_schema.py --output "$RUNNER_TEMP/tenant-foundation/schema.json"
      - name: Qualify real TLS pools, cancellation, tenant authorization and composed readiness
        run: GENUI_NATIVE_REPORT="$RUNNER_TEMP/tenant-foundation/native.json" cargo test --locked -p forma-app-platform --lib storage::qualification::native_postgres_campaign -- --ignored --exact --nocapture
      - name: Qualify admission operations and the operator command over TLS (APP-073)
        run: GENUI_ADMISSION_REPORT="$RUNNER_TEMP/tenant-foundation/admission.json" cargo test --locked -p forma-app-platform --lib storage::admission_qualification::native_admission_campaign -- --ignored --exact --nocapture
      - name: Qualify managed-entry cleanup on real TLS transports (APP-075)
        run: cargo test --locked -p forma-app-platform --lib storage::managed_qualification::tests::managed_cleanup_with_real_transports -- --ignored --exact --nocapture
      - name: Qualify typed definition admission and re-admission (APP-010)
        run: GENUI_DEFINITION_REPORT="$RUNNER_TEMP/tenant-foundation/definition.json" cargo test --locked -p forma-app-platform --lib storage::definition_qualification::native_definition_campaign -- --ignored --exact --nocapture
      - name: Qualify verified sign-in sessions, epochs and sign-out (APP-009)
        run: GENUI_SESSION_REPORT="$RUNNER_TEMP/tenant-foundation/session.json" cargo test --locked -p forma-app-platform --lib auth::tests::native_session_campaign -- --ignored --exact --nocapture
      - name: Qualify invite redemption and entitlement (APP-074)
        run: GENUI_INVITE_REPORT="$RUNNER_TEMP/tenant-foundation/invite.json" cargo test --locked -p forma-app-platform --lib auth::invite_tests::native_invite_campaign -- --ignored --exact --nocapture
      - name: Qualify route-level invitation races and provider faults (APP-082)
        run: GENUI_INVITE_RACE_REPORT="$RUNNER_TEMP/tenant-foundation/invite-races.json" cargo test --locked -p forma-app-platform --lib auth::invite_tests::native_invite_race_campaign -- --ignored --exact --nocapture
      - name: Qualify consent, member names and organization admin storage (trial plan D4/D5/D6)
        run: GENUI_ORG_ADMIN_REPORT="$RUNNER_TEMP/tenant-foundation/org-admin.json" cargo test --locked -p forma-app-platform --lib storage::org_admin_campaign::native_org_admin_campaign -- --ignored --exact --nocapture
      - name: Qualify explicit record commands, outcomes and audit (APP-013)
        run: GENUI_COMMAND_REPORT="$RUNNER_TEMP/tenant-foundation/command.json" cargo test --locked -p forma-app-platform --lib storage::command_qualification::native_command_campaign -- --ignored --exact --nocapture
      - name: Qualify command races, revocation and restart (APP-014)
        run: GENUI_RACE_REPORT="$RUNNER_TEMP/tenant-foundation/race.json" cargo test --locked -p forma-app-platform --lib storage::race_qualification::native_race_campaign -- --ignored --exact --nocapture
      - name: Qualify the confined query child (APP-012)
        run: GENUI_QUERY_PYTHON="$GITHUB_WORKSPACE/app/runtime/.venv/bin/python" cargo test --locked -p forma-app-platform --lib query::tests::engine_child_campaign -- --ignored --exact --nocapture
      - name: Qualify authorized queries, receipts and release (APP-012)
        run: GENUI_QUERY_PYTHON="$GITHUB_WORKSPACE/app/runtime/.venv/bin/python" GENUI_QUERY_REPORT="$RUNNER_TEMP/tenant-foundation/query.json" cargo test --locked -p forma-app-platform --lib storage::query_qualification::native_query_campaign -- --ignored --exact --nocapture
      - name: Qualify named live sharing and connected references (APP-154)
        run: GENUI_QUERY_PYTHON="$GITHUB_WORKSPACE/app/runtime/.venv/bin/python" GENUI_LIVE_SHARING_REPORT="$RUNNER_TEMP/tenant-foundation/live-sharing.json" cargo test --locked -p forma-app-platform --lib storage::shared_campaign::native_live_sharing_campaign -- --ignored --exact --nocapture
      - name: Qualify account-only share identity and callback (APP-154)
        run: GENUI_SHARED_IDENTITY_REPORT="$RUNNER_TEMP/tenant-foundation/shared-identity.json" cargo test --locked -p forma-app-platform --lib auth::shared_tests::native_shared_identity_campaign -- --ignored --exact --nocapture
      - name: Qualify record components, exact aggregates and guest release (APP-158/159)
        run: GENUI_QUERY_PYTHON="$GITHUB_WORKSPACE/app/runtime/.venv/bin/python" GENUI_RECORD_COMPONENTS_REPORT="$RUNNER_TEMP/tenant-foundation/record-components.json" cargo test --locked -p forma-app-platform --lib storage::record_components_campaign::native_record_components_campaign -- --ignored --exact --nocapture
      - name: Qualify private entries, reviewer-only commands and shares with roles (APP-191/192)
        run: GENUI_PRIVATE_ENTRIES_REPORT="$RUNNER_TEMP/tenant-foundation/private-entries.json" cargo test --locked -p forma-app-platform --lib storage::private_entries_campaign::native_private_entries_campaign -- --ignored --exact --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: app-008-tenant-foundation-evidence
          path: ${{ runner.temp }}/tenant-foundation
          retention-days: 14
