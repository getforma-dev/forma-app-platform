name: Tenant foundation qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tenant-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: Install recorded toolchains and locked operator validators
        run: |
          npm install --global npm@11.6.2
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.85.0 --profile minimal
          python3 -m venv app/runtime/.venv
          app/runtime/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r app/runtime/requirements.lock -r contracts/requirements.lock
          mkdir -p "$RUNNER_TEMP/tenant-foundation"
      - name: Check schema-version and catalog-bound pins, runner and pin-check unit tests
        run: |
          python3 scripts/check-schema-pins.py
          app/runtime/.venv/bin/python -m unittest discover -s scripts -p 'test_*.py' -v
          app/runtime/.venv/bin/python -m unittest discover -s app/runtime -v
          app/runtime/.venv/bin/python -m unittest discover -s app/qualification -v
      - name: Build source-owned native page assets
        working-directory: app/admin
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Check source, fixed-role primitives and the compiler floor
        working-directory: app
        run: |
          cargo +1.93.1 fmt --check
          cargo +1.93.1 clippy --locked --all-targets -- -D warnings
          cargo +1.93.1 test --locked --lib storage:: -- --test-threads=1
          cargo +1.85.0 check --locked --lib --tests
      - name: Qualify real PostgreSQL migration, catalog, RLS and lock races
        run: app/runtime/.venv/bin/python app/runtime/qualify_tenant_schema.py --output "$RUNNER_TEMP/tenant-foundation/schema.json"
      - name: Qualify real TLS pools, cancellation, tenant authorization and composed readiness
        working-directory: app
        run: GENUI_NATIVE_REPORT="$RUNNER_TEMP/tenant-foundation/native.json" cargo +1.93.1 test --locked --lib storage::qualification::native_postgres_campaign -- --ignored --exact --nocapture
      - name: Qualify admission operations and the operator command over TLS (APP-073)
        working-directory: app
        run: GENUI_ADMISSION_REPORT="$RUNNER_TEMP/tenant-foundation/admission.json" cargo +1.93.1 test --locked --lib storage::admission_qualification::native_admission_campaign -- --ignored --exact --nocapture
      - name: Qualify managed-entry cleanup on real TLS transports (APP-075)
        working-directory: app
        run: cargo +1.93.1 test --locked --lib storage::managed_qualification::tests::managed_cleanup_with_real_transports -- --ignored --exact --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-008-tenant-foundation-evidence
          path: ${{ runner.temp }}/tenant-foundation
          retention-days: 14
