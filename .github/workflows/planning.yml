name: Planning integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate tickets, coverage and preserved designs
        run: python3 Tickets/_tools/board.py check
