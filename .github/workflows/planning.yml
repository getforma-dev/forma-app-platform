name: Planning integrity
on:
  push:
  pull_request:
permissions:
  contents: read
# ADR-013 D13.5: a newer push to the same ref cancels this workflow's superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tickets, coverage and preserved designs
        run: python3 Tickets/_tools/board.py check
      - name: Test closed promotion candidate and artifact boundaries without AWS
        run: python3 -m unittest discover -s ops/promotion -p 'test_*.py' -v
