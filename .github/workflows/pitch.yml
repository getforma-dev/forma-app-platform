name: Pitch campaigns
# ADR-012 D12.6 / APP-131: the pitch-era Docker campaigns that need no model,
# no key and no sealed parser (scripts/dev/campaigns.tsv, `just campaigns`).
# Each takes 11-84 s locally once the test binary is built. Not here: `box`
# and the `parser-sandbox` probe (they need the sealed parser, `just parser`),
# the real-model and Open-Meteo smokes (keys and network; the repository is
# public) and the two managed helpers (run by tenant-foundation's managed
# campaign or by the operator).
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# ADR-013 D13.5: a newer push to the same ref cancels this workflow's superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pitch-campaigns:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.14'
      - name: Install recorded toolchains and the locked runtime environment
        run: |
          npm install --global npm@11.6.2
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          python3 -m venv app/runtime/.venv
          app/runtime/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r app/runtime/requirements.lock -r contracts/requirements.lock
          mkdir -p "$RUNNER_TEMP/pitch"
      - name: Build source-owned native page assets
        working-directory: app/admin
        run: |
          npm ci
          npm run build
      - name: Build the library test executable
        run: cargo test --locked -p forma-app-platform --lib --no-run
      - name: Actions campaign
        run: GENUI_ACTIONS_CAMPAIGN_REPORT="$RUNNER_TEMP/pitch/actions.json" cargo test --locked -p forma-app-platform --lib storage::actions_campaign::native_actions_campaign -- --ignored --exact --nocapture
      - name: Canvas campaign
        run: GENUI_CANVAS_CAMPAIGN_REPORT="$RUNNER_TEMP/pitch/canvas.json" cargo test --locked -p forma-app-platform --lib storage::query_qualification::canvas_campaign::native_canvas_campaign -- --ignored --exact --nocapture
      - name: Composer campaign
        run: GENUI_COMPOSER_REPORT="$RUNNER_TEMP/pitch/composer.json" cargo test --locked -p forma-app-platform --lib storage::composer_qualification::native_composer_campaign -- --ignored --exact --nocapture
      - name: MCP campaign
        run: GENUI_MCP_CAMPAIGN_REPORT="$RUNNER_TEMP/pitch/mcp.json" cargo test --locked -p forma-app-platform --lib storage::mcp_campaign::native_mcp_campaign -- --ignored --exact --nocapture
      - name: Pitch campaign
        run: GENUI_PITCH_CAMPAIGN_REPORT="$RUNNER_TEMP/pitch/pitch.json" cargo test --locked -p forma-app-platform --lib storage::query_qualification::pitch_campaign::native_pitch_campaign -- --ignored --exact --nocapture
      - name: Sharing campaign
        run: GENUI_SHARING_REPORT="$RUNNER_TEMP/pitch/sharing.json" cargo test --locked -p forma-app-platform --lib storage::sharing_qualification::native_sharing_campaign -- --ignored --exact --nocapture
      - name: Slack campaign
        run: GENUI_SLACK_CAMPAIGN_REPORT="$RUNNER_TEMP/pitch/slack.json" cargo test --locked -p forma-app-platform --lib storage::slack_campaign::native_slack_campaign -- --ignored --exact --nocapture
      - name: Workflows campaign
        run: GENUI_WORKFLOWS_CAMPAIGN_REPORT="$RUNNER_TEMP/pitch/workflows.json" cargo test --locked -p forma-app-platform --lib storage::workflows_campaign::native_workflows_campaign -- --ignored --exact --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: pitch-campaign-reports
          path: ${{ runner.temp }}/pitch
          if-no-files-found: ignore
          retention-days: 14
