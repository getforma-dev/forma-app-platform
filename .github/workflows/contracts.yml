name: Contract qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
      - name: Install isolated pinned validator and the library normalizer's DuckDB
        run: |
          python3 -m venv contracts/.venv
          # duckdb==2.0.0 is spikes/APP-005/requirements.lock, the same hashed
          # block as app/runtime/requirements.lock. The normalizer imports it.
          # The validator lock stays the jsonschema set.
          contracts/.venv/bin/python -m pip install --require-hashes --only-binary=:all: \
            -r contracts/requirements.lock -r spikes/APP-005/requirements.lock
      - name: Validate contract shapes, refusals, canonical bytes and the generated library
        run: |
          contracts/.venv/bin/python -m unittest discover -s contracts -p 'test_*.py' -v
          node contracts/verify_vectors.mjs
          contracts/.venv/bin/python contracts/lock.py check
          contracts/.venv/bin/python contracts/make_library.py --check
