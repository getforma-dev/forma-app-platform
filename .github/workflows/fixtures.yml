name: Synthetic fixture qualification
on:
  push:
  pull_request:
permissions:
  contents: read
# ADR-013 D13.5: a newer push to the same ref cancels this workflow's superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.14'
      - name: Install recorded parser and locked fixture dependencies
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          python3 -m venv spikes/APP-005/.venv
          spikes/APP-005/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r contracts/requirements.lock -r spikes/APP-005/requirements.lock -r app/runtime/requirements.lock
          mkdir -p "$RUNNER_TEMP/fixture-qualification"
      - name: Build the actual bounded parser
        working-directory: spikes/APP-004
        run: |
          python3 verify_vendor.py
          cargo build --locked -p parser-guest --target wasm32-unknown-unknown --release
          cargo build --locked -p parser-host
      - name: Check original bytes, arithmetic, parsing and the supported query subset
        run: spikes/APP-005/.venv/bin/python fixtures/qualify.py --output "$RUNNER_TEMP/fixture-qualification/parser-query"
      - name: Qualify disposable two-organization setup and deterministic reset
        run: spikes/APP-005/.venv/bin/python fixtures/reset_trial.py --output "$RUNNER_TEMP/fixture-qualification/reset"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: app-011-fixture-evidence
          path: ${{ runner.temp }}/fixture-qualification
          retention-days: 14
