name: Auth consumer qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  auth-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: spikes/APP-006
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: Install the recorded Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
      - name: Qualify local consumer refusals and bounded HTTP refresh
        run: python3 qualify.py --output "$RUNNER_TEMP/auth-consumer-qualification"
      - name: Build the separate canonical consumer qualification image
        run: docker build --file Dockerfile --tag genui-auth-key-qualification-ci .
      - name: Qualify the nonroot image without network access
        run: python3 qualify_hosted_key_image.py --image genui-auth-key-qualification-ci --output "$RUNNER_TEMP/auth-consumer-qualification/image-boundary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-006-auth-consumer-evidence
          path: ${{ runner.temp }}/auth-consumer-qualification
          retention-days: 14
